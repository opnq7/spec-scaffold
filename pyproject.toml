[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-scaffold"
version = "0.2.0"
description = "Turn a one-line idea into a Kiro-style spec folder (requirements / design / tasks)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "opnq7" }]
keywords = ["kiro", "spec-driven-development", "cli", "scaffolding", "requirements"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
spec-scaffold = "spec_scaffold.cli:main"

[project.urls]
Homepage = "https://github.com/opnq7/spec-scaffold"
Changelog = "https://github.com/opnq7/spec-scaffold/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["spec_scaffold"]

[tool.setuptools.package-data]
spec_scaffold = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["spec_scaffold"]
# `python -m spec_scaffold` is a three-line shim around main(); it is exercised
# by hand, not by the unit tests.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
