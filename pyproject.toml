[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-scaffold"
version = "0.1.0"
description = "Turn a one-line idea into a Kiro-style spec folder (requirements / design / tasks)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "opnq7" }]
keywords = ["kiro", "spec-driven-development", "cli", "scaffolding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spec-scaffold = "spec_scaffold.cli:main"

[project.urls]
Homepage = "https://github.com/opnq7/spec-scaffold"

[tool.setuptools]
packages = ["spec_scaffold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
